<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智云科技 · 客服工单</title>
<link rel="stylesheet" href="/static/customer.css">
</head>
<body>
<div id="customer-app">

  <!-- Header -->
  <div class="cus-header">
    <div class="cus-header-left">
      <span class="cus-back-btn" id="cusBackBtn" style="display:none;" onclick="CustomerView.back()">← 返回</span>
      <span class="cus-header-title" id="cusHeaderTitle">我的工单</span>
    </div>
    <button class="cus-new-btn" id="cusNewBtn" onclick="CustomerView.showCreate()">新建工单</button>
  </div>

  <!-- View 1: Ticket List -->
  <div class="cus-view" id="cusTicketList">
    <div class="cus-list-container" id="ticketListContainer">
      <div class="cus-empty">加载中...</div>
    </div>
  </div>

  <!-- View 2: Create Ticket Form -->
  <div class="cus-view" id="cusTicketCreate" style="display:none;">
    <div class="cus-form">
      <label class="cus-label">标题</label>
      <input type="text" id="ticketTitle" class="cus-input" placeholder="简要描述您遇到的问题" maxlength="200">
      <label class="cus-label">详细描述</label>
      <textarea id="ticketDescription" class="cus-textarea" rows="6" placeholder="请详细描述您遇到的问题，包括：&#10;1. 问题的具体表现&#10;2. 出现的时间和频率&#10;3. 您已经尝试过的操作"></textarea>
      <button class="cus-submit-btn" id="cusSubmitBtn" onclick="CustomerView.submitTicket()">提交工单</button>
      <div class="cus-form-error" id="cusFormError" style="display:none;"></div>
    </div>
  </div>

  <!-- View 3: Ticket Detail -->
  <div class="cus-view" id="cusTicketDetail" style="display:none;">
    <div class="cus-detail-header" id="cusDetailHeader"></div>
    <div class="cus-messages" id="cusMessages"></div>
    <div class="cus-satisfaction" id="cusSatisfaction" style="display:none;">
      <div class="cus-sat-title">您的问题是否已解决？</div>
      <div class="cus-sat-buttons">
        <button class="cus-sat-btn yes" onclick="CustomerView.selectRating('yes')">✓ 已解决</button>
        <button class="cus-sat-btn no" onclick="CustomerView.selectRating('no')">✗ 未解决</button>
      </div>
      <textarea id="cusFeedbackText" class="cus-sat-textarea" rows="2" placeholder="补充您的意见..."></textarea>
      <button class="cus-sat-submit" onclick="CustomerView.submitFeedback()">提交反馈</button>
    </div>
  </div>

</div>
<script type="module" src="/static/js/customer.js"></script>
</body>
</html>
